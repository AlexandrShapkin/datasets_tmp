name: Build cucumber mixer open-set dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_cucumber_mixer_open_set.yml"
      - "scripts/build_cucumber_mixer_open_set.py"
      - "scripts/run_open_set_builder.py"
      - "scripts/build_dataset_core.py"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build_cucumber_mixer_open_set.yml"
      - "scripts/build_cucumber_mixer_open_set.py"
      - "scripts/run_open_set_builder.py"
      - "scripts/OPEN_SET_TRIGGER"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Compile-check builder
        run: python -m py_compile scripts/build_cucumber_mixer_open_set.py scripts/run_open_set_builder.py

      - name: Build and validate dataset
        run: |
          set -o pipefail
          python scripts/run_open_set_builder.py 2>&1 | tee /tmp/open_set_build.log

      - name: Preserve complete log
        if: always()
        run: |
          mkdir -p dist_open_set
          cp /tmp/open_set_build.log dist_open_set/build.log || true

      - name: Publish dataset and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-concrete-mixer-open-set
          path: |
            dist_open_set/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
