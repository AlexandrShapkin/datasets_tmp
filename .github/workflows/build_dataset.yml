name: Build unique classification dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_dataset.yml"
      - "scripts/**"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build_dataset.yml"
      - "scripts/**"
      - "requirements.txt"
      - "BUILD_TRIGGER"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install builder dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Compile-check builder
        run: python -m py_compile scripts/build_dataset.py

      - name: Build and validate dataset
        run: |
          python scripts/build_dataset.py \
            --count 100 \
            --candidate-limit 900 \
            --source-limit 180 \
            --workers 18 \
            --batch-size 24 \
            --output dist \
            --work .work

      - name: Publish dataset archive and reports
        uses: actions/upload-artifact@v4
        with:
          name: feijoa-carrot-watermelon-unique-classification
          path: |
            dist/feijoa_carrot_watermelon_unique_classification.zip
            dist/build_summary.json
            dist/dataset/contact_sheets/*.jpg
            dist/dataset/validation.json
            dist/dataset/manifest.csv
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
