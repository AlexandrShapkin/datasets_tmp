name: Probe cucumber Kaggle dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe_cucumber_kaggle.yml"
      - "scripts/probe_cucumber_kaggle.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe_cucumber_kaggle.yml"
      - "scripts/probe_cucumber_kaggle.py"
      - "scripts/CUCUMBER_PROBE_TRIGGER"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install KaggleHub
        run: python -m pip install --upgrade kagglehub
      - name: Probe paths
        run: python scripts/probe_cucumber_kaggle.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-kaggle-probe
          path: dist_cucumber_probe/**
          if-no-files-found: error
          retention-days: 2
